services:

  auth-service:
    container_name: call-qa-auth-service
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - 8000:8000
      - 5678:5678
    command: |
      bash -c "
      while !</dev/tcp/${AUTH_DB_HOST}/${AUTH_DB_PORT}; do sleep 1; done;
      alembic upgrade heads &&
      python -m debugpy --listen 0.0.0.0:5678 -m uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    volumes:
      - ./app:/app
    networks:
      - call-qa-net

  db:
    container_name: call-qa-db
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - call_qa_db_data:/var/lib/postgresql/data
    networks:
      - call-qa-net

networks:
  call-qa-net:
    driver: bridge

volumes:
  call_qa_db_data:
    driver: local
    name: call_qa_db_data
